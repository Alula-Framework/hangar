name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:6.3.3
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3.3"]

    # A dedicated database per job. The integration suite drops and recreates
    # its fixture tables, so it needs a server of its own — see CONTRIBUTING.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hangar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Every dependency is public now, so this is a rate-limit courtesy
      # rather than a requirement — a fork with no secret resolves fine.
      - name: Configure git
        run: |
          if [ -n "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.SWIFTFLIGHT_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fi
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # Fails rather than silently skipping if the database is unreachable.
      # A green run that skipped every integration test proves almost nothing,
      # and this suite's whole value is what it proves against real Postgres.
      #
      # This used to test whether the variable was empty — in a step that set
      # it to a literal on the line above, so it could never fire. What can
      # actually go wrong is the service: a container that never became
      # healthy, or a hostname that does not resolve from inside this one. So
      # open the socket. Bash's /dev/tcp needs no client installed, which
      # matters because the Swift image ships no psql.
      - name: Verify the integration gate is armed
        run: |
          if ! timeout 10 bash -c 'cat < /dev/null > /dev/tcp/postgres/5432' 2>/dev/null; then
            echo "::error::postgres:5432 is unreachable — every integration suite would skip"
            exit 1
          fi
          echo "postgres:5432 is reachable"

      - name: Test
        env:
          HANGAR_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hangar_test
        run: ./CI/run-tests.sh

      # The compile-time claim, checked the only way it can be: by trying to
      # compile queries Postgres would reject, and failing if they build.
      - name: Invalid queries do not compile
        run: ./CI/check-invalid-queries-fail.sh

  macos:
    name: Build on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # 6.2 rather than the 6.3.3 the Linux jobs use: setup-swift does not
      # index 6.3 yet. It satisfies this package's tools version, so the job
      # still answers the question it exists to answer — does the macOS
      # platform claim compile.
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      # Build only. macOS runners have no Docker and GitHub service
      # containers are Linux-only, so there is no database to test against
      # here — and a run where every integration suite skipped proves almost
      # nothing. (The suites do skip cleanly now; the Linux job's "verify the
      # integration gate is armed" step is what keeps a skipped run from
      # passing for the wrong reason.) This job exists to prove the
      # `platforms: [.macOS(.v15)]` claim in Package.swift compiles; Linux
      # is where the test coverage lives.

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      # Every dependency is public now, so this is a rate-limit courtesy
      # rather than a requirement — a fork with no secret resolves fine.
      - name: Configure git
        run: |
          if [ -n "${{ secrets.SWIFTFLIGHT_CI_TOKEN }}" ]; then
            git config --global url."https://x-access-token:${{ secrets.SWIFTFLIGHT_CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fi
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Generate documentation
        env:
          HANGAR_BUILD_DOCS: "1"
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target Hangar \
            --warnings-as-errors --output-path ./docs
